name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GNOME Shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-shell gnome-shell-extension-prefs gjs \
            libglib2.0-bin gettext libarchive-tools

      # Every module must at least parse and link. prefs.js imports a resource://
      # path that only exists inside the Shell's preferences process, so it is
      # checked separately with that import stubbed out.
      #
      # widget.js pulls in Clutter/St, and package installs their typelibs and
      # libst.so under Mutter's own versioned directories - real gnome-shell
      # knows to look there, but a standalone gjs does not, so both paths have
      # to be given explicitly or "Requiring Clutter... not found" is all you
      # get for the trouble.
      - name: Load the modules
        run: |
          MUTTER_DIR="$(dirname "$(find /usr/lib -maxdepth 3 -iname 'Clutter-*.typelib' | head -1)")"
          export GI_TYPELIB_PATH="$MUTTER_DIR:/usr/lib/gnome-shell"
          export LD_LIBRARY_PATH="/usr/lib/gnome-shell"
          for f in extension/lib/*.js; do
            gjs -c "import('file://$PWD/$f')
              .then(() => print('ok   $f'))
              .catch(e => { printerr('FAIL $f: ' + e); imports.system.exit(1); })"
          done

      - name: Convert and verify the bundled themes
        run: make check

      - name: Build the bundle
        run: make pack

      - uses: actions/upload-artifact@v4
        with:
          name: platter-shell-extension
          path: build/*.shell-extension.zip
