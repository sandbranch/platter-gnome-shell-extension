<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280">
  <defs>
    <radialGradient id="cone" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#d8b382"/>
      <stop offset="55%" stop-color="#a97f4c"/>
      <stop offset="100%" stop-color="#6e5535"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa0a6"/>
      <stop offset="100%" stop-color="#6f7479"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfe2e4"/>
      <stop offset="45%" stop-color="#c7cbce"/>
      <stop offset="100%" stop-color="#a3a8ac"/>
    </linearGradient>
  </defs>

  <!-- handle: squared off, two posts and a straight top bar -->
  <path d="M 66 34 L 66 -14 L 334 -14 L 334 34"
        fill="none" stroke="#c7cbce" stroke-width="10" stroke-linejoin="miter"/>
  <path d="M 66 34 L 66 -14 L 334 -14 L 334 34"
        fill="none" stroke="#4b4f52" stroke-width="10" stroke-linejoin="miter" stroke-dasharray="1 13"/>
  <circle cx="66" cy="36" r="9" fill="#8a8f94" stroke="#4b4f52" stroke-width="1.5"/>
  <circle cx="334" cy="36" r="9" fill="#8a8f94" stroke="#4b4f52" stroke-width="1.5"/>

  <!-- body -->
  <rect x="10" y="30" width="380" height="235" rx="16" fill="url(#body)" stroke="#4b4f52" stroke-width="2"/>
  <rect x="10" y="30" width="380" height="10" rx="5" fill="#c7cbce" opacity="0.5"/>

  <!-- top-deck controls: knobs and slide switches between the handle posts -->
  <g>
    <rect x="88" y="34" width="14" height="7" rx="1.5" fill="#26282a"/>
    <rect x="88" y="34" width="14" height="3" rx="1.5" fill="#8a8f94"/>

    <circle cx="122" cy="38" r="7" fill="#26282a" stroke="#c7cbce" stroke-width="1"/>
    <circle cx="122" cy="38" r="2" fill="#c7cbce"/>

    <circle cx="150" cy="38" r="7" fill="#26282a" stroke="#c7cbce" stroke-width="1"/>
    <circle cx="150" cy="38" r="2" fill="#c7cbce"/>

    <rect x="170" y="34" width="8" height="8" fill="#e0483c"/>
    <rect x="184" y="34" width="8" height="8" fill="#8a8f94"/>

    <circle cx="215" cy="38" r="9" fill="#26282a" stroke="#c7cbce" stroke-width="1.5"/>
    <circle cx="215" cy="38" r="2.5" fill="#c7cbce"/>

    <circle cx="248" cy="38" r="7" fill="#26282a" stroke="#c7cbce" stroke-width="1"/>
    <circle cx="248" cy="38" r="2" fill="#c7cbce"/>

    <circle cx="276" cy="38" r="7" fill="#26282a" stroke="#c7cbce" stroke-width="1"/>
    <circle cx="276" cy="38" r="2" fill="#c7cbce"/>

    <rect x="298" y="34" width="14" height="7" rx="1.5" fill="#26282a"/>
    <rect x="298" y="34" width="14" height="3" rx="1.5" fill="#8a8f94"/>
  </g>

  <!-- left speaker -->
  <g>
    <circle cx="95" cy="140" r="70" fill="#3a3d40"/>
    <circle cx="95" cy="140" r="70" fill="none" stroke="#c7cbce" stroke-width="3"/>
    <circle cx="95" cy="140" r="58" fill="url(#cone)"/>
    <circle cx="95" cy="140" r="58" fill="none" stroke="#4b3a22" stroke-width="1"/>
    <circle cx="95" cy="140" r="42" fill="none" stroke="#4b3a22" stroke-width="1" opacity="0.6"/>
    <circle cx="95" cy="140" r="26" fill="none" stroke="#4b3a22" stroke-width="1" opacity="0.6"/>
    <circle cx="95" cy="140" r="13" fill="#2c2416"/>
  </g>

  <!-- right speaker -->
  <g>
    <circle cx="305" cy="140" r="70" fill="#3a3d40"/>
    <circle cx="305" cy="140" r="70" fill="none" stroke="#c7cbce" stroke-width="3"/>
    <circle cx="305" cy="140" r="58" fill="url(#cone)"/>
    <circle cx="305" cy="140" r="58" fill="none" stroke="#4b3a22" stroke-width="1"/>
    <circle cx="305" cy="140" r="42" fill="none" stroke="#4b3a22" stroke-width="1" opacity="0.6"/>
    <circle cx="305" cy="140" r="26" fill="none" stroke="#4b3a22" stroke-width="1" opacity="0.6"/>
    <circle cx="305" cy="140" r="13" fill="#2c2416"/>
  </g>

  <!-- centre console plate -->
  <rect x="140" y="42" width="120" height="205" rx="6" fill="#5b5f63" stroke="#3a3d40" stroke-width="2"/>

  <!-- tuner bezel (seekbar sits inside this) -->
  <rect x="148" y="46" width="104" height="20" rx="3" fill="#26282a"/>

  <!-- artwork bezel (artwork/nocover sits inside this) -->
  <rect x="150" y="72" width="100" height="88" rx="4" fill="#26282a"/>

  <!-- button plate -->
  <rect x="150" y="166" width="100" height="26" rx="4" fill="#44474a"/>

  <!-- nameplate: an inlaid manufacturer-style plate, not a screen - the dynamic
       title/artist/album text (drawn by theme.json, not this file) sits inside
       it like a logotype and model line would on a real machine -->
  <rect x="40" y="196" width="320" height="46" rx="4" fill="url(#plate)"
        stroke="#7a7e82" stroke-width="1"/>
  <rect x="42" y="198" width="316" height="1" fill="#f2f4f5" opacity="0.8"/>
  <rect x="42" y="240" width="316" height="1.5" fill="#6f7479" opacity="0.7"/>
  <g stroke="#8a8f94" stroke-width="0.5" opacity="0.4">
    <line x1="46" y1="204" x2="354" y2="204"/>
    <line x1="46" y1="208" x2="354" y2="208"/>
    <line x1="46" y1="234" x2="354" y2="234"/>
    <line x1="46" y1="238" x2="354" y2="238"/>
  </g>
  <text x="352" y="238" font-family="DejaVu Sans" font-weight="bold" font-size="7"
        fill="#7a7e82" text-anchor="end" letter-spacing="1">PLATTER</text>

  <!-- grille texture, both sides -->
  <g stroke="#4b4f52" stroke-width="2" opacity="0.5">
    <line x1="20" y1="45" x2="20" y2="235"/>
    <line x1="26" y1="45" x2="26" y2="235"/>
    <line x1="374" y1="45" x2="374" y2="235"/>
    <line x1="380" y1="45" x2="380" y2="235"/>
  </g>
</svg>
